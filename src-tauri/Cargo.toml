[package]
name = "domado"
version = "4.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }

[features]
# E2E(WebdriverIO) 전용: 앱 안에 WebDriver 서버를 띄운다. 배포 빌드에는 넣지 않는다
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
